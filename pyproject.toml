[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gemmafischer"
version = "0.3.0"
description = "A local, evidence-grounded chess game-to-mastery coach"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "pydantic>=2.11,<3",
  "python-chess>=1.999,<2",
  "rfc8785>=0.1.4,<0.2",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
deterministic = []
full = ["mlx-lm>=0.31.3,<0.32", "psutil>=7,<8"]
data = ["zstandard>=0.25,<0.26"]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=2.3,<3",
  "playwright>=1.55,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.16,<0.17",
]

[project.scripts]
gemmafischer = "gemmafischer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemmafischer"]

[tool.hatch.build.targets.wheel.force-include]
"assets/model-manifest.json" = "gemmafischer/resources/assets/model-manifest.json"
"data/sources.json" = "gemmafischer/resources/data/sources.json"
"data/evaluation/accuracy_positions.jsonl" = "gemmafischer/resources/data/evaluation/accuracy_positions.jsonl"
"data/evaluation/diagnostic_positions.jsonl" = "gemmafischer/resources/data/evaluation/diagnostic_positions.jsonl"
"data/evaluation/test_questions.jsonl" = "gemmafischer/resources/data/evaluation/test_questions.jsonl"
"data/evaluation/tutoring_cases.jsonl" = "gemmafischer/resources/data/evaluation/tutoring_cases.jsonl"
"training/post-training.json" = "gemmafischer/resources/training/post-training.json"
"training/mlx-lora.yaml" = "gemmafischer/resources/training/mlx-lora.yaml"

[tool.hatch.build.targets.sdist]
include = ["src/gemmafischer", "README.md", "LICENSE", "assets", "data", "training"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "hardware: requires a real chess engine or Apple Silicon runtime",
  "model: requires downloaded model assets",
]

[tool.coverage.run]
source = ["gemmafischer"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gemmafischer"]

[[tool.mypy.overrides]]
module = [
  "huggingface_hub",
  "huggingface_hub.*",
  "mlx",
  "mlx.*",
  "mlx_lm",
  "mlx_lm.*",
  "zstandard",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gemmafischer.runtime", "gemmafischer.model_profile"]
disable_error_code = ["no-untyped-call"]
