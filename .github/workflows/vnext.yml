name: GemmaFischer public alpha verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {lfs: false}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --frozen --group dev
      - run: uv run gemmafischer doctor --profile dev
      - run: uv run gemmafischer verify --tier portable
  local-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {lfs: false}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {python-version: "3.12", enable-cache: true}
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: uv sync --frozen --group dev --extra data
      - run: uv run playwright install --with-deps chromium
      - run: echo "/usr/games" >> "$GITHUB_PATH"
      - run: uv run gemmafischer verify --tier local-alpha
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --frozen --group dev --all-extras
      - run: uv run --with pip-audit pip-audit
