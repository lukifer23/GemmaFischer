name: GemmaFischer 0.2 verification
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --frozen --group dev
      - run: uv run gemmafischer doctor --profile dev
      - run: uv run ruff check src/gemmafischer tests
      - run: uv run mypy
      - run: uv run pytest -m "not model"
      - run: uv run gemmafischer repo-audit
      - run: uv run python -c "from gemmafischer.web import create_app; import json; print(json.dumps(create_app().openapi(), sort_keys=True, indent=2))" > /tmp/openapi.json
      - run: diff -u docs/openapi.json /tmp/openapi.json
