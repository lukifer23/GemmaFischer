# Unified ChessGemma Configuration
# This file consolidates all configuration settings into a single, validated system.

# Model Configuration
model:
  pretrained_model_path: "google/gemma-3-270m"
  local_model_path: null
  model_id_env: "CHESSGEMMA_MODEL_ID"
  model_path_env: "CHESSGEMMA_MODEL_PATH"

# Engine Configuration
chess_engine:
  primary: "lc0"
  lc0:
    enabled: true
    engine_path: "/opt/homebrew/bin/lc0"
    weights_file: "models/lc0_weights/network.pb.gz"
    backend: "metal"
    threads: 4  # Optimized for M3 Pro GPU cores
    nn_cache_size: 262144  # Reduced for M3 Pro memory constraints
    use_pool: true
    time_limit: 1.5  # Faster response time
    depth: null
    # Ensure custom weights are used, not Homebrew defaults
    weights_priority: "custom"
    search_paths:
      - "/opt/homebrew/bin/lc0"
      - "/usr/local/bin/lc0"
      - "/usr/bin/lc0"
      - "lc0"
  fallback:
    engine_path: "/opt/homebrew/bin/stockfish"
    threads: 4  # Better performance for fallback
    hash: 256  # Increased hash for better analysis
    skill_level: 20
    show_wdl: true
    depth: 16  # Slightly reduced for faster fallback
    time_limit: 0.8  # Faster fallback response
    search_paths:
      - "/opt/homebrew/bin/stockfish"
      - "/usr/local/bin/stockfish"
      - "/usr/bin/stockfish"
      - "/usr/games/stockfish"
      - "stockfish"

# Training Configuration (Default)
training:
  output_dir: "checkpoints/lora_default"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 1200
  learning_rate: 1.6e-4
  num_train_epochs: 1
  warmup_steps: 120
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 25
  save_steps: 150
  eval_strategy: "steps"
  eval_steps: 150
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: false
  remove_unused_columns: false
  dataloader_pin_memory: false
  dataloader_num_workers: 0

# LoRA Configuration
lora:
  r: 32
  lora_alpha: 64
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Expert-Specific Training Configurations
experts:
  uci:
    output_dir: "checkpoints/lora_uci"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 12
    max_steps: 1600  # Reduced since LC0 is primary UCI engine
    learning_rate: 2.0e-4
    num_train_epochs: 1
    warmup_steps: 160  # Adjusted for shorter training
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 20
    save_steps: 200
    eval_strategy: "steps"
    eval_steps: 200
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    lr_scheduler_type: "cosine"
    fp16: false
    bf16: false
    remove_unused_columns: false
    dataloader_pin_memory: false
    dataloader_num_workers: 0

  tutor:
    output_dir: "checkpoints/lora_tutor"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 1800  # Increased for better educational explanations
    learning_rate: 1.6e-4
    num_train_epochs: 1
    warmup_steps: 180  # Adjusted for longer training
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 40
    save_steps: 200
    eval_strategy: "steps"
    eval_steps: 200
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    lr_scheduler_type: "cosine"
    fp16: false
    bf16: false
    remove_unused_columns: false
    dataloader_pin_memory: false
    dataloader_num_workers: 0

  director:
    output_dir: "checkpoints/lora_director"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 1600  # Increased for better strategic reasoning
    learning_rate: 1.6e-4
    num_train_epochs: 1
    warmup_steps: 160  # Adjusted for longer training
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 40
    save_steps: 200
    eval_strategy: "steps"
    eval_steps: 200
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    lr_scheduler_type: "cosine"
    fp16: false
    bf16: false
    remove_unused_columns: false
    dataloader_pin_memory: false
    dataloader_num_workers: 0

# Curriculum Configuration
curriculum:
  phases: []

# Inference Configuration
inference:
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.1
  use_cache: true
  pad_token_id: null
  eos_token_id: null

  # Expert-specific overrides - optimized for hybrid architecture
  engine_temperature: 0.0
  engine_top_p: 1.0
  engine_do_sample: false
  engine_max_new_tokens: 8  # UCI moves are short

  tutor_temperature: 0.8  # Slightly higher for more creative explanations
  tutor_top_p: 0.95
  tutor_do_sample: true
  tutor_max_new_tokens: 180  # Allow longer explanations

  director_temperature: 0.7  # Balanced for strategic guidance
  director_top_p: 0.92
  director_do_sample: true
  director_max_new_tokens: 220  # Strategic analysis needs more space

# Cache Configuration - Optimized for hybrid LLM/LC0 architecture
cache:
  max_cache_size: 1024  # Increased for LLM responses
  engine_cache_max: 2048  # Increased for LC0 analysis results
  cache_ttl_seconds: 3600
  enable_response_cache: true
  enable_engine_cache: true
  enable_kv_cache: true
  # Hybrid-specific optimizations
  hybrid_cache_enabled: true  # Cache combined LLM+LC0 responses
  hybrid_cache_max: 512  # Separate cache for hybrid results

# System Configuration
system:
  debug_mode: false
  log_level: "INFO"
  device: "mps"
  seed: 42
  max_workers: 4
  timeout_minutes: 300
  memory_limit_gb: 16.0

# MoE Configuration
moe:
  enabled: true
  router_checkpoint_path: null
  router_learning_rate: 1.0e-3
  router_hidden_dim: 128
  router_training_steps: 1000
  ensemble_weight_threshold: 0.3
  adaptive_routing_enabled: true
  performance_tracking_enabled: true
  retraining_threshold: 0.1
  context_aware_routing: true
  feedback_learning_rate: 0.01
  min_expert_confidence: 0.6
  max_expert_response_time: 2.0
  ensemble_size: 2
  retrain_action: "targeted_retrain"
  retrain_focus_categories:
    - rules_explanation
    - endgame_principles
    - opening_strategy

# Performance Configuration - Optimized for M3 Pro hybrid architecture
performance:
  enable_performance_monitoring: true
  metrics_collection_interval: 30  # More frequent monitoring for hybrid system
  slow_query_threshold: 1.5  # Adjusted for LC0 + LLM combined latency
  memory_monitoring_enabled: true
  cache_performance_tracking: true
  model_loading_optimization: true
  batch_processing_enabled: true
  parallel_inference_enabled: true
  tokenizer_batch_size: 8
  inference_queue_size: 150  # Increased for hybrid processing
  # Hybrid-specific optimizations
  hybrid_processing_enabled: true
  engine_priority_boost: 0.8  # Prioritize LC0 for UCI moves
  llm_optimization_enabled: true  # Optimize LLM for educational responses

# Dataset Configuration
datasets:
  - path: "data/standardized/standardized_uci_expert_v2.jsonl"
    weight: 1.0
  - path: "data/standardized/standardized_tutor_expert_v2.jsonl"
    weight: 1.0
  - path: "data/standardized/standardized_director_expert_v3.jsonl"
    weight: 1.0

