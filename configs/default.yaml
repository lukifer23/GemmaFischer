# Unified ChessGemma Configuration
# This file consolidates all configuration settings into a single, validated system.

# Model Configuration
model:
  pretrained_model_path: "google/gemma-3-270m"
  local_model_path: null
  model_id_env: "CHESSGEMMA_MODEL_ID"
  model_path_env: "CHESSGEMMA_MODEL_PATH"

# Engine Configuration
chess_engine:
  primary: "lc0"
  lc0:
    enabled: true
    engine_path: "lc0"
    weights_file: "models/lc0_weights/network.pb.gz"
    backend: "metal"
    threads: 2
    nn_cache_size: 200000
    time_limit: 2.0
    depth: null
    search_paths:
      - "/opt/homebrew/bin/lc0"
      - "/usr/local/bin/lc0"
      - "/usr/bin/lc0"
      - "lc0"
  fallback:
    engine_path: "/opt/homebrew/bin/stockfish"
    threads: 2
    hash: 128
    skill_level: 20
    show_wdl: true
    depth: 18
    time_limit: 0.5
    search_paths:
      - "/opt/homebrew/bin/stockfish"
      - "/usr/local/bin/stockfish"
      - "/usr/bin/stockfish"
      - "stockfish"

# Training Configuration (Default)
training:
  output_dir: "checkpoints/lora_default"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 1200
  learning_rate: 1.6e-4
  num_train_epochs: 1
  warmup_steps: 120
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 25
  save_steps: 150
  eval_strategy: "steps"
  eval_steps: 150
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: false
  remove_unused_columns: false
  dataloader_pin_memory: false
  dataloader_num_workers: 0

# LoRA Configuration
lora:
  r: 32
  lora_alpha: 64
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Expert-Specific Training Configurations
experts:
  uci:
    output_dir: "checkpoints/lora_uci"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 12
    max_steps: 2400
    learning_rate: 2.0e-4
    num_train_epochs: 1
    warmup_steps: 200
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 20
    save_steps: 200
    eval_strategy: "steps"
    eval_steps: 200
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    lr_scheduler_type: "cosine"
    fp16: false
    bf16: false
    remove_unused_columns: false
    dataloader_pin_memory: false
    dataloader_num_workers: 0

  tutor:
    output_dir: "checkpoints/lora_tutor"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 1600
    learning_rate: 1.6e-4
    num_train_epochs: 1
    warmup_steps: 160
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 40
    save_steps: 200
    eval_strategy: "steps"
    eval_steps: 200
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    lr_scheduler_type: "cosine"
    fp16: false
    bf16: false
    remove_unused_columns: false
    dataloader_pin_memory: false
    dataloader_num_workers: 0

  director:
    output_dir: "checkpoints/lora_director"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 1400
    learning_rate: 1.6e-4
    num_train_epochs: 1
    warmup_steps: 140
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 40
    save_steps: 200
    eval_strategy: "steps"
    eval_steps: 200
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    lr_scheduler_type: "cosine"
    fp16: false
    bf16: false
    remove_unused_columns: false
    dataloader_pin_memory: false
    dataloader_num_workers: 0

# Curriculum Configuration
curriculum:
  phases: []

# Inference Configuration
inference:
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.1
  use_cache: true
  pad_token_id: null
  eos_token_id: null

  # Expert-specific overrides
  engine_temperature: 0.0
  engine_top_p: 1.0
  engine_do_sample: false
  engine_max_new_tokens: 8

  tutor_temperature: 0.7
  tutor_top_p: 0.9
  tutor_do_sample: true
  tutor_max_new_tokens: 150

  director_temperature: 0.6
  director_top_p: 0.9
  director_do_sample: true
  director_max_new_tokens: 200

# Cache Configuration
cache:
  max_cache_size: 512
  engine_cache_max: 1024
  cache_ttl_seconds: 3600
  enable_response_cache: true
  enable_engine_cache: true
  enable_kv_cache: true

# System Configuration
system:
  debug_mode: false
  log_level: "INFO"
  device: "auto"
  seed: 42
  max_workers: 4
  timeout_minutes: 300
  memory_limit_gb: 16.0

# MoE Configuration
moe:
  enabled: true
  router_checkpoint_path: null
  router_learning_rate: 1.0e-3
  router_hidden_dim: 128
  router_training_steps: 1000
  ensemble_weight_threshold: 0.3
  adaptive_routing_enabled: true
  performance_tracking_enabled: true
  retraining_threshold: 0.1
  context_aware_routing: true
  feedback_learning_rate: 0.01
  min_expert_confidence: 0.6
  max_expert_response_time: 2.0
  ensemble_size: 2
  retrain_action: "targeted_retrain"
  retrain_focus_categories:
    - rules_explanation
    - endgame_principles
    - opening_strategy

# Performance Configuration
performance:
  enable_performance_monitoring: true
  metrics_collection_interval: 60
  slow_query_threshold: 1.0
  memory_monitoring_enabled: true
  cache_performance_tracking: true
  model_loading_optimization: true
  batch_processing_enabled: true
  parallel_inference_enabled: true
  tokenizer_batch_size: 8
  inference_queue_size: 100

# Dataset Configuration
datasets:
  - path: "data/standardized/standardized_uci_expert_v2.jsonl"
    weight: 1.0
  - path: "data/standardized/standardized_tutor_expert_v2.jsonl"
    weight: 1.0
  - path: "data/standardized/standardized_director_expert_v3.jsonl"
    weight: 1.0

