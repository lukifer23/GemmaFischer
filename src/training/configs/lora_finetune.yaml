# LoRA fine-tune config for a small POC
model:
  pretrained_model_path: "unsloth/gemma-3-270m-it"
training:
  output_dir: "checkpoints/lora_poc"
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 100
  learning_rate: 2e-4
  fp16: false
  logging_steps: 10
  save_steps: 50
lora:
  r: 8
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  dropout: 0.05
# You can either set a single dataset.path or a weighted list under datasets.
datasets:
  - path: "data/standardized/standardized_uci_expert.jsonl"
    weight: 0.34
  - path: "data/standardized/standardized_tutor_expert.jsonl"
    weight: 0.33
  - path: "data/standardized/standardized_director_expert_v2.jsonl"
    weight: 0.33
